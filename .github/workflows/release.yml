name: Release build

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      engine: ${{ steps.latest.outputs.engine }}
      build: ${{ steps.latest.outputs.build }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/luheinteractive/Headland/tags --paginate --jq '.[].name' | sort -V | tail -n1)"
          engine="$(gh release view --repo apogeeengine/builds --json tagName --jq .tagName)"
          test -n "$tag" -a -n "$engine"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then build=false; else build=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      ref: ${{ needs.check.outputs.tag }}
      engine_release: ${{ needs.check.outputs.engine }}
      tag: ${{ needs.check.outputs.tag }}