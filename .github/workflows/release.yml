name: Release build

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      engine: ${{ steps.latest.outputs.engine }}
      build: ${{ steps.latest.outputs.build }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_KEY: ${{ secrets.GAME_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          # The source repo is private: its tags are read with its deploy key (the workflow token can't see it).
          install -m 600 /dev/null "$RUNNER_TEMP/source_key"
          printf '%s\n' "$SOURCE_KEY" > "$RUNNER_TEMP/source_key"
          tag="$(GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/source_key -o StrictHostKeyChecking=accept-new" \
            git ls-remote --tags --refs git@github.com:luheinteractive/Headland.git | sed 's|.*refs/tags/||' | sort -V | tail -n1)"
          engine="$(gh release view --repo apogeeengine/builds --json tagName --jq .tagName)"
          test -n "$tag" -a -n "$engine"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then build=false; else build=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      ref: ${{ needs.check.outputs.tag }}
      engine_release: ${{ needs.check.outputs.engine }}
      tag: ${{ needs.check.outputs.tag }}