name: Nightly

# Every night, if Headland's main has moved since the last nightly: exports it with the engine's nightly (else its latest
# release) and replaces the `nightly` prerelease.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if main has not moved
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.main.outputs.sha }}
      changed: ${{ steps.main.outputs.changed }}
      engine: ${{ steps.main.outputs.engine }}
    steps:
      - id: main
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ secrets.GAME_DEPLOY_KEY }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/key"
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/key"
          sha="$(GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/key -o StrictHostKeyChecking=accept-new" \
            git ls-remote git@github.com:luheinteractive/Headland.git refs/heads/main | cut -f1)"
          last="$(gh release view nightly --repo "$GITHUB_REPOSITORY" --json body --jq .body 2> /dev/null | sed -n 's/^commit: //p' || true)"
          echo "main $sha, last nightly $last"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" != "$last" ] || [ "${{ inputs.force }}" = true ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if gh release view nightly --repo apogeeengine/builds > /dev/null 2>&1; then echo "engine=nightly" >> "$GITHUB_OUTPUT"; else echo "engine=" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      ref: ${{ needs.check.outputs.sha }}
      engine_release: ${{ needs.check.outputs.engine }}
      tag: nightly
